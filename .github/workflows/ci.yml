name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22.18.0"
  WAILS3_VERSION: "v3.0.0-beta.30"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build + WebKitGTK 4.1 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      # Wails v3 beta.30 defaults to GTK4/webkitgtk-6.0 on Linux; the project
      # targets GTK3 + WebKitGTK 4.1 (spec decision), selected by the gtk3 tag.
      - name: Install pinned Wails v3 CLI
        run: go install ${{ runner.os == 'Linux' && '-tags gtk3' || '' }} github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      # Tests and the end-to-end run use the official converter programs pinned in
      # tools/versions.txt (7-Zip everywhere; chdman and DolphinTool on Windows).
      - name: Fetch the pinned converter programs
        shell: bash
        run: bash tools/fetch-tools.sh

      - name: Vet and test core packages (Wails-free)
        run: |
          go vet ./internal/...
          go test ./internal/...

      - name: Build app (frontend + go, via Wails task)
        run: wails3 task build ${{ runner.os == 'Linux' && 'EXTRA_TAGS=gtk3' || '' }}

      # End-to-end UI tests: the app built in Wails server mode, driven by a
      # headless browser. Linux only (no display needed, fastest runner).
      - name: End-to-end UI tests (Linux)
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Smoke test — window opens without crashing (Linux)
        if: runner.os == 'Linux'
        run: |
          # bash runs with -e: capture the exit code instead of letting 124
          # (killed by timeout = still running = success) abort the step.
          code=0
          xvfb-run -a timeout 10 ./bin/romcure || code=$?
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "App exited early with code $code"
            exit 1
          fi

      - name: Smoke test — window opens without crashing (macOS)
        if: runner.os == 'macOS'
        # macOS runners have no `timeout`: start in the background and check
        # the process is still alive after 10 seconds.
        run: |
          ./bin/romcure &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          else
            wait "$pid"; code=$?
            echo "App exited early with code $code"
            exit 1
          fi

      - name: Smoke test — window opens without crashing (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "bin/romcure.exe" -PassThru
          Start-Sleep -Seconds 5
          $running = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $running) {
            Write-Error "App exited early — did not stay running"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
